name: Build Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/**'
      - 'UPSTREAM_REVISION'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout RetroVideo TV
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build aarch64 debug APK
        run: bash scripts/build-android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroVideo-TV-aarch64-debug
          path: work/RetroArch/pkg/android/phoenix/build/outputs/apk/aarch64/debug/*.apk
          if-no-files-found: error
